# بناء تطبيق «مُرتِّل» تلقائيًا مع كل push على main.
# - النسخة الجاهزة بتتنزل في Releases باسم murattil-latest
# - سجل البناء كامل بيتحفظ في فرع ci-log (ملف log.txt) عشان نراجع الأخطاء
name: murattil-apk

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: murattil-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Mark started
        run: |
          mkdir -p /tmp/start && cd /tmp/start && git init -q
          git config user.name "murattil-ci" && git config user.email "murattil-ci@users.noreply.github.com"
          echo "${GITHUB_SHA} started $(date -u)" > status.txt
          git add . && git commit -qm "started ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:ci-log

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.kts', 'android/gradle/wrapper/gradle-wrapper.properties', 'pubspec.lock') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Cache mushaf fonts
        uses: actions/cache@v4
        with:
          path: assets/qcf
          key: qcf-v1-ttf-604

      - name: Build
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          LOG="$GITHUB_WORKSPACE/ci-log.txt"
          : > "$LOG"
          status=ok
          run() { echo "===== \$ $*" >> "$LOG"; "$@" >> "$LOG" 2>&1; rc=$?; echo "===== exit $rc" >> "$LOG"; return $rc; }
          run flutter --version
          run node tool/fetch_mushaf_fonts.mjs || status=fonts_failed
          run flutter create --org com.murattil --project-name murattil --platforms android . || status=create_failed
          run git status --short
          run flutter pub get || status=pub_failed
          run flutter analyze --no-fatal-infos --no-fatal-warnings || echo "analyze had errors" >> "$LOG"
          run flutter test || echo "tests failed" >> "$LOG"
          if [ "$status" = ok ]; then
            # المستودعات أحيانًا بترجع 429 (ضغط) — نعيد المحاولة بعد شوية
            ok=0
            for attempt in 1 2 3; do
              if run flutter build apk --release --split-per-abi; then ok=1; break; fi
              echo "retry build after network error ($attempt)" >> "$LOG"; sleep 60
            done
            [ "$ok" = 1 ] || status=build_failed
          fi
          echo "STATUS: $status" >> "$LOG"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          ls -la build/app/outputs/flutter-apk/ >> "$LOG" 2>&1

      - name: Publish APK release
        if: steps.build.outputs.status == 'ok'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk murattil.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk murattil-old-phones.apk
          gh release delete murattil-latest -y --cleanup-tag || true
          gh release create murattil-latest murattil.apk murattil-old-phones.apk --target "$GITHUB_SHA" --prerelease \
            --title "مُرتِّل — آخر نسخة تجريبية" \
            --notes "نسخة تجريبية اتبنت تلقائيًا من آخر تعديل. نزّل murattil.apk وثبّته على الموبايل (لو الموبايل قديم جدًا ومارضيش يثبّت، جرّب murattil-old-phones.apk)."

      - name: Enable KVM
        if: steps.build.outputs.status == 'ok'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - name: Smoke test on emulator
        if: steps.build.outputs.status == 'ok'
        continue-on-error: true
        timeout-minutes: 25
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swangle_indirect -memory 4096 -noaudio -no-boot-anim -camera-back none
          script: OUT=$GITHUB_WORKSPACE/smoke bash tool/ci_smoke.sh build/app/outputs/flutter-apk/app-x86_64-release.apk > $GITHUB_WORKSPACE/smoke-log.txt 2>&1 || true

      - name: Save log to ci-log branch
        if: always()
        run: |
          mkdir -p /tmp/ci && cd /tmp/ci && git init -q
          git config user.name "murattil-ci"
          git config user.email "murattil-ci@users.noreply.github.com"
          cp "$GITHUB_WORKSPACE/ci-log.txt" log.txt || echo "no log" > log.txt
          cp "$GITHUB_WORKSPACE/smoke-log.txt" smoke-log.txt 2>/dev/null || true
          if [ -d "$GITHUB_WORKSPACE/smoke" ]; then mkdir -p smoke && cp "$GITHUB_WORKSPACE"/smoke/*.png "$GITHUB_WORKSPACE"/smoke/*.txt smoke/ 2>/dev/null || true; fi
          echo "${GITHUB_SHA} ${{ steps.build.outputs.status }}" > status.txt
          git add . && git commit -qm "ci ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:ci-log

      - uses: actions/upload-artifact@v4
        if: steps.build.outputs.status == 'ok'
        with:
          name: murattil-apk
          path: build/app/outputs/flutter-apk/*.apk
