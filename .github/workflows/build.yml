# بناء تطبيق «مُرتِّل» تلقائيًا مع كل push على main.
# - النسخة الجاهزة بتتنزل في Releases باسم murattil-latest
# - سجل البناء كامل بيتحفظ في فرع ci-log (ملف log.txt) عشان نراجع الأخطاء
name: murattil-apk

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: murattil-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Mark started
        run: |
          mkdir -p /tmp/start && cd /tmp/start && git init -q
          git config user.name "murattil-ci" && git config user.email "murattil-ci@users.noreply.github.com"
          echo "${GITHUB_SHA} started $(date -u)" > status.txt
          git add . && git commit -qm "started ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:ci-log

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache mushaf fonts
        uses: actions/cache@v4
        with:
          path: assets/qcf
          key: qcf-v1-ttf-604

      - name: Build
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          LOG="$GITHUB_WORKSPACE/ci-log.txt"
          : > "$LOG"
          status=ok
          run() { echo "===== \$ $*" >> "$LOG"; "$@" >> "$LOG" 2>&1; rc=$?; echo "===== exit $rc" >> "$LOG"; return $rc; }
          run flutter --version
          run node tool/fetch_mushaf_fonts.mjs || status=fonts_failed
          run flutter create --org com.murattil --project-name murattil --platforms android . || status=create_failed
          run git status --short
          run flutter pub get || status=pub_failed
          run flutter analyze --no-fatal-infos --no-fatal-warnings || echo "analyze had errors" >> "$LOG"
          run flutter test || echo "tests failed" >> "$LOG"
          if [ "$status" = ok ]; then
            run flutter build apk --release || status=build_failed
          fi
          echo "STATUS: $status" >> "$LOG"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          ls -la build/app/outputs/flutter-apk/ >> "$LOG" 2>&1

      - name: Save log to murattil-ci branch
        if: always()
        run: |
          mkdir -p /tmp/ci && cd /tmp/ci && git init -q
          git config user.name "murattil-ci"
          git config user.email "murattil-ci@users.noreply.github.com"
          cp "$GITHUB_WORKSPACE/ci-log.txt" log.txt || echo "no log" > log.txt
          echo "${GITHUB_SHA} ${{ steps.build.outputs.status }}" > status.txt
          git add . && git commit -qm "ci ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:ci-log

      - name: Publish APK release
        if: steps.build.outputs.status == 'ok'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk murattil.apk
          gh release delete murattil-latest -y --cleanup-tag || true
          gh release create murattil-latest murattil.apk --target "$GITHUB_SHA" --prerelease \
            --title "مُرتِّل — آخر نسخة تجريبية" \
            --notes "نسخة تجريبية اتبنت تلقائيًا من آخر تعديل. نزّل murattil.apk وثبّته على الموبايل."

      - uses: actions/upload-artifact@v4
        if: steps.build.outputs.status == 'ok'
        with:
          name: murattil-apk
          path: build/app/outputs/flutter-apk/app-release.apk
