name: murattil
description: مُرتِّل — مصحف المدينة وختمة يومية. مجاني لوجه الله، من غير إعلانات، ويشتغل من غير نت.
publish_to: "none"
version: 1.2.0+3

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  shared_preferences: ^2.3.3
  flutter_animate: ^4.5.0
  just_audio: ">=0.9.42 <0.11.0"
  just_audio_background: ^0.0.1-beta.11
  path_provider: ^2.1.4
  http: ^1.2.2
  flutter_local_notifications: ^19.4.2
  timezone: ^0.10.1
  flutter_timezone: ^4.1.1
  wakelock_plus: ^1.2.8
  geolocator: ^13.0.4
  flutter_compass: ^0.8.1
  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/quran/
    - assets/quran/text/
    - assets/quran/tafsir/
    # خطوط صفحات مصحف المدينة (٦٠٤ خط) — بتتنزّل مرة واحدة بـ: node tool/fetch_mushaf_fonts.mjs
    - assets/qcf/
  fonts:
    - family: Plex
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Light.ttf
          weight: 300
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
    - family: AmiriQuran
      fonts:
        - asset: assets/fonts/AmiriQuran-Regular.ttf
